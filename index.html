<!doctype html>

    <meta charset="utf-8" />
    <!-- Google Tag Manager (GTM-P38DZ6G5) and Google Analytics (G-0TR5TFH9KP). Not loaded on the admin or the local dev server.
         A private order link's token (/order/123?t=…) is moved out of the address bar first,
         so it never reaches analytics. Consent Mode: until the visitor accepts cookies (the banner,
         src/consent.ts), Google stores no cookies. vercel.json's CSP lists this script's SHA-256 hash. -->
    <script>
      (function (w, d, l) {
        var p = l.pathname, m = /[?&]t=([^&#]+)/.exec(l.search);
        if (/^\/order\/\d+/.test(p) && m) {
          try { sessionStorage.setItem('elden-order-token:' + p.split('/')[2], decodeURIComponent(m[1])); } catch (e) { return; }
          history.replaceState(history.state, '', p + l.search.replace(/([?&])t=[^&#]*&?/, '$1').replace(/[?&]$/, '') + l.hash);
        }
        if (/^\/admin(\/|$)/.test(p) || /^(localhost|127\.0\.0\.1)$/.test(l.hostname)) return;
        // A student signed in on this browser: no analytics or ad scripts at all.
        try { if (localStorage.getItem('elden-student') === '1') return; } catch (e) {}
        w.dataLayer = w.dataLayer || [];
        w.gtag = function () { w.dataLayer.push(arguments); };
        var c = null;
        try { c = localStorage.getItem('elden-consent'); } catch (e) {}
        var g = c === 'all' ? 'granted' : 'denied';
        w.gtag('consent', 'default', { ad_storage: g, ad_user_data: g, ad_personalization: g, analytics_storage: g });
        w.gtag('js', new Date());
        // Staff signed in to the admin show up as internal traffic (filtered out in GA4).
        var staff = false;
        try { staff = !!localStorage.getItem('elden-admin-auth') && !/[?&]meta-test/.test(l.search) && sessionStorage.getItem('elden-meta-test') !== '1'; } catch (e) {}
        w.gtag('config', 'G-0TR5TFH9KP', staff ? { traffic_type: 'internal' } : {});
        ['gtm.js?id=GTM-P38DZ6G5', 'gtag/js?id=G-0TR5TFH9KP'].forEach(function (src) {
          var s = d.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/' + src;
          d.head.appendChild(s);
        });
      })(window, document, location);
    </script>
