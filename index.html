<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Google Analytics (G-0TR5TFH9KP), loaded with gtag.js. Not loaded on the admin or the local dev server.
         It starts once the page has loaded (or after 2.5 s, whichever is first; at once for a Google ad click), so on slow
         phone data the page itself and the Meta Pixel aren't stuck behind Google's 180 KB. (Google Tag Manager was removed: its only tag loaded this same GA.)
         A private order link's token (/order/123?t=…) is moved out of the address bar first,
         so it never reaches analytics. vercel.json's CSP lists this script's SHA-256 hash. -->
    <script>
      (function (w, d, l) {
        var p = l.pathname, m = /[?&]t=([^&#]+)/.exec(l.search);
        if (/^\/order\/\d+/.test(p) && m) {
          try { sessionStorage.setItem('elden-order-token:' + p.split('/')[2], decodeURIComponent(m[1])); } catch (e) { return; }
          history.replaceState(history.state, '', p + l.search.replace(/([?&])t=[^&#]*&?/, '$1').replace(/[?&]$/, '') + l.hash);
        }
        if (/^\/admin(\/|$)/.test(p) || /^(localhost|127\.0\.0\.1)$/.test(l.hostname)) return;
        // A student signed in on this browser: no analytics or ad scripts at all.
        try { if (localStorage.getItem('elden-student') === '1') return; } catch (e) {}
        w.dataLayer = w.dataLayer || [];
        w.gtag = function () { w.dataLayer.push(arguments); };
        // No cookie choice on this site (src/consent.ts): Google may store its cookies for every visitor.
        w.gtag('consent', 'default', { ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted', analytics_storage: 'granted' });
        w.gtag('js', new Date());
        // Staff signed in to the admin show up as internal traffic (filtered out in GA4).
        var staff = false;
        try { staff = !!localStorage.getItem('elden-admin-auth') && !/[?&]meta-test/.test(l.search) && sessionStorage.getItem('elden-meta-test') !== '1'; } catch (e) {}
        w.gtag('config', 'G-0TR5TFH9KP', staff ? { traffic_type: 'internal' } : {});
        var started = false;
        function start() {
          if (started) return;
          started = true;
          var s = d.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-0TR5TFH9KP';
          d.head.appendChild(s);
        }
        // Arriving from a Google ad: start now, so the click id is read before the visitor moves on.
        if (d.readyState === 'complete' || /[?&](gclid|gbraid|wbraid)=/.test(l.search)) start(); else w.addEventListener('load', start);
        setTimeout(start, 2500);
      })(window, document, location);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Meta's Pixel script comes from here early on every page: open the connection now. -->
    <link rel="preconnect" href="https://connect.facebook.net" />
    <title>Elden Academic Press</title>
    <meta name="description" content="Textbooks, reference books, practice papers and journals for classrooms across India." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elden Academic Press" />
    <meta property="og:title" content="Elden Academic Press" />
    <meta property="og:description" content="Textbooks, reference books, practice papers and journals for classrooms across India." />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/elden-icon-64.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Elden Academic Press",
        "legalName": "FLYKRAFT SYNERIGIES PRIVATE LIMITED",
        "url": "https://eldenap.in/",
        "logo": "https://eldenap.in/assets/elden-mark.png",
        "email": "hello@eldenap.in",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Kolghatti, near Black Tank Reformatory School",
          "addressLocality": "Hazaribagh",
          "addressRegion": "Jharkhand",

        }

    </script>
    <!-- The catalogue and store settings (every store page needs them) start downloading now, alongside the scripts. -->
    <link rel="preload" href="/api/catalog" as="fetch" crossorigin />
    <link rel="preload" href="/api/config" as="fetch" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Small on purpose: starts the Meta Pixel (src/early.ts), then the app (src/boot.tsx). -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
