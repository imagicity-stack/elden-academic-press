<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Google Tag Manager (GTM-P38DZ6G5). Not loaded on the admin or the local dev server.
         A private order link's token (/order/123?t=…) is moved out of the address bar first,
         so it never reaches analytics. vercel.json's CSP lists this script's SHA-256 hash. -->
    <script>
      (function (w, d, l) {
        var p = l.pathname, m = /[?&]t=([^&#]+)/.exec(l.search);
        if (/^\/order\/\d+/.test(p) && m) {
          try { sessionStorage.setItem('elden-order-token:' + p.split('/')[2], decodeURIComponent(m[1])); } catch (e) { return; }
          history.replaceState(history.state, '', p + l.search.replace(/([?&])t=[^&#]*&?/, '$1').replace(/[?&]$/, '') + l.hash);
        }
        if (/^\/admin(\/|$)/.test(p) || /^(localhost|127\.0\.0\.1)$/.test(l.hostname)) return;
        w.dataLayer = w.dataLayer || [];
        w.gtag = function () { w.dataLayer.push(arguments); };
        w.gtag('js', new Date());
        var s = d.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-P38DZ6G5';
        d.head.appendChild(s);
      })(window, document, location);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elden Academic Press</title>
    <meta name="description" content="Textbooks, reference books, practice papers and journals for classrooms across India." />

    <meta property="og:title" content="Elden Academic Press" />
    <meta property="og:description" content="Textbooks, reference books, practice papers and journals for classrooms across India." />
    <meta property="og:url" content="https://eldenap.in/" />
    <meta property="og:image" content="https://eldenap.in/assets/elden-mark.png" />
    <link rel="icon" type="image/png" href="/assets/elden-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
  </head>
